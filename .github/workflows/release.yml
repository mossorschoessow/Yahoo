name: Build Windows app

on:
  push:
    tags: ["v*"]        # 推送 v1.0.0 這種標籤就會自動建立 Release
  workflow_dispatch:    # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build exe
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: YahooAuctionMonitor
          path: dist/YahooAuctionMonitor.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YahooAuctionMonitor.exe
          generate_release_notes: true
